<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDrop | Secure File Transfer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-color: #f3f4f6; --surface: #ffffff; --text-main: #111827; --text-sub: #6b7280; --border: #e5e7eb; --success: #10b981; --error: #ef4444; --radius: 12px; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%); height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-main); }
        .container { width: 100%; max-width: 600px; background: var(--surface); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); max-height: 90vh; display: flex; flex-direction: column; position: relative; }
        
        /* NEW: Top Navigation for Login */
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .login-link { text-decoration: none; color: var(--primary); font-size: 0.9rem; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; background: #eef2ff; }
        .login-link:hover { background: #e0e7ff; }

        .header { margin-bottom: 30px; text-align: center; }
        .header h2 { font-weight: 600; font-size: 1.5rem; margin-bottom: 8px; }
        .header p { color: var(--text-sub); font-size: 0.95rem; }
        .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px; text-align: center; transition: all 0.2s ease; cursor: pointer; background: #fafafa; flex-shrink: 0; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: #eef2ff; }
        .drop-zone input[type="file"] { display: none; }
        .icon-cloud { width: 64px; height: 64px; color: var(--primary); margin-bottom: 15px; opacity: 0.8; }
        .drop-text-main { font-weight: 500; color: var(--text-main); margin-bottom: 5px; }
        .drop-text-sub { font-size: 0.85rem; color: var(--text-sub); }
        .browse-btn { color: var(--primary); font-weight: 600; cursor: pointer; }
        .browse-btn:hover { text-decoration: underline; }
        .file-list { margin-top: 25px; list-style: none; overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .file-list::-webkit-scrollbar { width: 6px; }
        .file-list::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 10px; }
        .file-item { background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; position: relative; overflow: hidden; transition: all 0.3s ease; }
        .file-item-content { display: flex; align-items: center; padding: 12px; position: relative; z-index: 2; }
        .file-icon { width: 40px; height: 40px; background: #e0e7ff; color: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 15px; flex-shrink: 0; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
        .file-actions { margin-left: 15px; }
        .delete-btn { background: none; border: none; cursor: pointer; color: var(--text-sub); padding: 5px; }
        .delete-btn:hover { color: var(--error); }
        .progress-container { position: absolute; bottom: 0; left: 0; height: 4px; width: 0%; background: var(--success); transition: width 0.1s linear; z-index: 1; }
        
        .link-result { display: none; padding: 0 12px 12px 12px; border-top: 1px solid var(--border); background: #f0fdf4; animation: slideDown 0.3s ease forwards; }
        .link-result-header { display: flex; align-items: center; padding-top: 8px; margin-bottom: 8px; font-size: 0.8rem; color: #166534; font-weight: 600; }
        .link-input-group { display: flex; gap: 8px; }
        .link-btn { flex: 1; padding: 8px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #bbb; background: white; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; text-decoration: none; color: var(--text-main); }
        .link-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
        .link-btn.primary-link { background: var(--primary); color: white; border: none; }
        .link-btn.primary-link:hover { background: var(--primary-hover); }

        .actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 12px; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
        .btn-secondary { background: white; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .file-item { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Button Section -->
        <div class="top-nav">
            <a href="admin.html" class="login-link">Admin Login</a>
        </div>

        <div class="header">
            <h2>Upload & Share</h2>
            <p>Upload files to your secure private cloud</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" multiple>
            <svg class="icon-cloud" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <div class="drop-text-main">Drag & drop files or <span class="browse-btn">Browse</span></div>
            <div class="drop-text-sub">Supported: All formats up to 2GB</div>
        </div>

        <ul class="file-list" id="fileList"></ul>

        <div class="actions">
            <button class="btn btn-secondary" onclick="clearFiles()">Clear All</button>
            <button class="btn btn-primary" id="uploadBtn" onclick="uploadFiles()" disabled>Upload Files</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        let filesToUpload = [];

        dropZone.addEventListener('click', () => fileInput.click());
        
        ['dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                if(evt === 'dragover') dropZone.classList.add('drag-over');
                else dropZone.classList.remove('drag-over');
                if(evt === 'drop') handleFiles(e.dataTransfer.files);
            });
        });

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length > 0) {
                for (const file of files) {
                    if(!filesToUpload.some(f => f.name === file.name && f.size === file.size)) {
                        filesToUpload.push({ file, status: 'pending', id: Math.random().toString(36).substr(2, 9) });
                        addFileToUI(filesToUpload[filesToUpload.length - 1]);
                    }
                }
                updateUploadButton();
            }
        }

        function formatBytes(bytes) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }

        function addFileToUI(fileObj) {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.id = `item-${fileObj.id}`;
            
            li.innerHTML = `
                <div class="file-item-content">
                    <div class="file-icon">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div class="file-info">
                        <div class="file-name">${fileObj.file.name}</div>
                        <div class="file-size">${formatBytes(fileObj.file.size)}</div>
                    </div>
                    <div class="file-actions">
                        <button class="delete-btn" onclick="removeFile('${fileObj.id}')">✕</button>
                    </div>
                </div>
                <div class="progress-container"></div>
                <div class="link-result">
                    <div class="link-result-header">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right:5px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Upload Complete
                    </div>
                    <div class="link-input-group">
                        <a href="#" target="_blank" class="link-btn primary-link open-link-btn">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            Open Link
                        </a>
                        <button class="link-btn copy-link-btn">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Copy Link
                        </button>
                    </div>
                </div>
            `;
            fileList.appendChild(li);
        }

        function removeFile(id) {
            filesToUpload = filesToUpload.filter(f => f.id !== id);
            const el = document.getElementById(`item-${id}`);
            if(el) el.remove();
            updateUploadButton();
        }

        function clearFiles() {
            filesToUpload = [];
            fileList.innerHTML = '';
            updateUploadButton();
            fileInput.value = '';
        }

        function updateUploadButton() {
            const pending = filesToUpload.filter(f => f.status === 'pending').length;
            uploadBtn.disabled = pending === 0;
            uploadBtn.innerText = pending === 0 ? 'Upload Files' : `Upload ${pending} File${pending > 1 ? 's' : ''}`;
        }

        function uploadFiles() {
            const pendingFiles = filesToUpload.filter(f => f.status === 'pending');
            if(pendingFiles.length === 0) return;

            uploadBtn.disabled = true;
            uploadBtn.innerText = 'Uploading...';

            pendingFiles.forEach(fileObj => {
                const el = document.getElementById(`item-${fileObj.id}`);
                const progressBar = el.querySelector('.progress-container');
                const deleteBtn = el.querySelector('.delete-btn');
                if(deleteBtn) deleteBtn.remove(); 

                const formData = new FormData();
                formData.append('file', fileObj.file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/upload', true);

                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = (e.loaded / e.total) * 100;
                        progressBar.style.width = percentComplete + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        fileObj.status = 'uploaded';
                        progressBar.style.opacity = '0';
                        const linkArea = el.querySelector('.link-result');
                        linkArea.style.display = 'block';
                        const openBtn = el.querySelector('.open-link-btn');
                        openBtn.href = response.url;
                        const copyBtn = el.querySelector('.copy-link-btn');
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(response.url).then(() => {
                                const originalText = copyBtn.innerHTML;
                                copyBtn.innerText = 'Copied!';
                                copyBtn.style.color = 'var(--success)';
                                setTimeout(() => {
                                    copyBtn.innerHTML = originalText;
                                    copyBtn.style.color = '';
                                }, 2000);
                            });
                        };
                        checkAllDone();
                    } else {
                        console.error('Upload failed');
                        progressBar.style.background = 'var(--error)';
                    }
                };
                xhr.send(formData);
            });
        }

        function checkAllDone() {
            if(filesToUpload.every(f => f.status === 'uploaded')) {
                uploadBtn.innerText = 'Upload Complete';
                setTimeout(() => {
                    uploadBtn.disabled = false;
                    uploadBtn.innerText = 'Upload Files';
                }, 2000);
            }
        }
    </script>
</body>
</html>
