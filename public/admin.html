<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CloudDrop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --surface: #ffffff; --text-main: #111827; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Login Screen */
        #loginScreen { max-width: 400px; margin: 100px auto; background: var(--surface); padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1rem; }
        .btn { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn:hover { opacity: 0.9; }
        
        /* Dashboard */
        #dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logout-btn { background: #fee2e2; color: #991b1b; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }

        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .file-card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .file-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .file-preview { height: 120px; background: #f9fafb; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .file-preview img, .file-preview video { width: 100%; height: 100%; object-fit: cover; }
        .file-name { font-weight: 500; font-size: 0.9rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 15px; }
        
        .actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: none; font-weight: 500; }
        .view-btn { background: #e0e7ff; color: var(--primary); text-decoration: none; text-align: center; }
        .del-btn { background: #fee2e2; color: #ef4444; }
        .del-btn:hover { background: #fecaca; }
        
        .empty-state { text-align: center; color: #6b7280; padding: 40px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <h2>Admin Access</h2>
        <p style="color: #6b7280; margin-bottom: 20px;">Enter secure password to manage files</p>
        <input type="password" id="passwordInput" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
        <p id="errorMsg" style="color: var(--error); margin-top: 10px; display: none;">Invalid Password</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container">
        <div class="header">
            <h2>File Manager</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="file-grid" id="fileGrid"></div>
    </div>

    <script>
        // Check if already logged in on load
        fetch('/api/check-auth').then(r => r.json()).then(data => {
            if(data.isAdmin) showDashboard();
        });

        async function login() {
            const password = document.getElementById('passwordInput').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            
            if (data.success) {
                showDashboard();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadFiles();
        }

        async function loadFiles() {
            const res = await fetch('/api/admin/files');
            const files = await res.json();
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = '';

            if (files.length === 0) {
                grid.innerHTML = '<div class="empty-state">No files uploaded yet.</div>';
                return;
            }

            files.forEach(file => {
                const isImg = file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                const isVid = file.name.match(/\.(mp4|webm|mov)$/i);
                
                let preview = `<div style="color: #9ca3af; font-size: 2rem;">📄</div>`;
                if(isImg) preview = `<img src="${file.url}" loading="lazy">`;
                else if(isVid) preview = `<video src="${file.url}#t=0.5" preload="metadata"></video>`;

                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-preview">${preview}</div>
                    <div>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-meta">${formatBytes(file.size)} • ${new Date(file.created).toLocaleDateString()}</div>
                        <div class="actions">
                            <a href="${file.url}" target="_blank" class="action-btn view-btn">View</a>
                            <button onclick="deleteFile('${file.name}')" class="action-btn del-btn">Delete</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteFile(filename) {
            if(!confirm('Are you sure you want to delete this file?')) return;
            
            const res = await fetch(`/api/admin/files/${filename}`, { method: 'DELETE' });
            if(res.ok) {
                loadFiles();
            } else {
                alert('Error deleting file');
            }
        }

        function formatBytes(bytes) {
            if (!+bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
        }
    </script>
</body>
</html>
